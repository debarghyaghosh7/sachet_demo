<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#7a1620">
  <meta name="description" content="Sachet: check investment tips and messages for scam warning signs, in Hindi and English. On-device, no data collected.">
  <title>Sachet · सचेत</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="icon.svg" alt="" width="32" height="32"><div><b data-i18n="appName">सचेत</b><small data-i18n="tagline"></small></div></div>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="hi" aria-pressed="true">हिं</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <main>
    <!-- Screen 1: input -->
    <section id="screen-input" class="screen">
      <h1 data-i18n="heroTitle"></h1>
      <p class="sub" data-i18n="heroSub"></p>
      <p class="privacy">🔒 <span data-i18n="privacy"></span></p>

      <label for="msg" class="lbl" data-i18n="inputLabel"></label>
      <textarea id="msg" rows="7" data-i18n-ph="placeholder"></textarea>

      <div class="row">
        <button id="btn-mic" class="btn ghost" type="button">🎤 <span data-i18n="btnMic"></span></button>
        <button id="btn-shot" class="btn ghost" type="button">📷 <span data-i18n="btnShot"></span></button>
        <button id="btn-clear" class="btn ghost" type="button" data-i18n="btnClear"></button>
        <input id="file" type="file" accept="image/*" hidden>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <p class="tiny"><span data-i18n="micNote"></span> <span data-i18n="ocrNote"></span></p>

      <button id="btn-check" class="btn primary big" type="button" data-i18n="btnCheck"></button>

      <div class="samples">
        <span class="lbl" data-i18n="samplesTitle"></span>
        <div class="chips">
          <button class="chip" data-sample="0" data-i18n="s1"></button>
          <button class="chip" data-sample="1" data-i18n="s2"></button>
          <button class="chip" data-sample="2" data-i18n="s3"></button>
          <button class="chip" data-sample="3" data-i18n="s4"></button>
        </div>
      </div>
    </section>

    <!-- Screen 2: result -->
    <section id="screen-result" class="screen" hidden>
      <div id="result"></div>
      <div class="row stack">
        <button class="btn ghost" data-act="listen" id="btn-listen" type="button">🔊 <span data-i18n="listen"></span></button>
        <button class="btn primary" data-act="complain" type="button" data-i18n="complain"></button>
        <button class="btn ghost" data-act="again" type="button" data-i18n="again"></button>
      </div>
    </section>

    <!-- Screen 3: complaint -->
    <section id="screen-complain" class="screen" hidden>
      <button class="link" data-act="toresult" type="button">← <span data-i18n="back"></span></button>
      <h1 data-i18n="cTitle"></h1>
      <p class="sub" data-i18n="cIntro"></p>
      <form id="cform" autocomplete="off">
        <label><span data-i18n="cName"></span><input id="f-name" type="text"></label>
        <label><span data-i18n="cCity"></span><input id="f-city" type="text"></label>
        <label><span data-i18n="cPhone"></span><input id="f-phone" type="text"></label>
        <label><span data-i18n="cDate"></span><input id="f-date" type="date"></label>
        <label><span data-i18n="cMode"></span>
          <select id="f-mode">
            <option value="whatsapp"></option><option value="telegram"></option><option value="sms"></option>
            <option value="call"></option><option value="web"></option><option value="social"></option><option value="other"></option>
          </select>
        </label>
        <label><span data-i18n="cContacts"></span><input id="f-contacts" type="text"></label>
        <fieldset>
          <legend data-i18n="cScenario"></legend>
          <label class="radio"><input type="radio" name="scn" value="approached" checked> <span data-i18n="cApproached"></span></label>
          <label class="radio"><input type="radio" name="scn" value="lost"> <span data-i18n="cLost"></span></label>
        </fieldset>
        <div id="lostbox" hidden>
          <label><span data-i18n="cAmount"></span><input id="f-amount" type="text" inputmode="numeric"></label>
          <label><span data-i18n="cPaidTo"></span><input id="f-paidto" type="text"></label>
        </div>
        <label><span data-i18n="cWhat"></span><textarea id="f-what" rows="4"></textarea></label>
        <label class="radio"><input id="f-incmsg" type="checkbox" checked> <span data-i18n="cIncludeMsg"></span></label>
        <label><span data-i18n="cDraftLang"></span>
          <select id="f-dlang"><option value="en">English</option><option value="hi">हिन्दी</option></select>
        </label>
        <button class="btn primary" id="btn-build" type="button" data-i18n="cBuild"></button>
      </form>
      <textarea id="draft" rows="16" aria-label="Draft"></textarea>
      <div class="row">
        <button class="btn ghost" id="btn-copy" type="button" data-i18n="cCopy"></button>
        <button class="btn ghost" id="btn-dl" type="button" data-i18n="cDownload"></button>
      </div>
      <p class="tiny" data-i18n="cNote"></p>
      <p class="tiny" data-i18n="cWhere"></p>
    </section>
  </main>

  <footer><p data-i18n="footer"></p></footer>

  <script src="i18n.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
